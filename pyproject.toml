[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foreverdb"
version = "0.1.0"
description = "Evidence-first data foundation for a WoW: Forever database (M1)"
requires-python = ">=3.11"
dependencies = []          # stdlib only, by design

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs acquired source snapshots under data/raw (auto-skipped otherwise)"]

[tool.setuptools.packages.find]
where = ["src"]
